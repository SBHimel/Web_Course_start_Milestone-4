<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Issues</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">

</head>

<body class="bg-gray-100">

    <!-- Navbar -->

    <div class="navbar bg-white shadow px-6 flex justify-between">

        <div class=" text-xl font-bold">
            GitHub Issues Tracker
        </div>

        <div class="flex gap-2">

            <input id="searchInput" type="text" placeholder="Search issues" class="input input-bordered">

            <button onclick="searchIssue()" class="btn btn-primary">
                Search
            </button>

        </div>

    </div>


    <!-- Tabs -->

    <div class="max-w-6xl mx-auto mt-6">

        <div class="tabs">

            <button onclick="loadIssues()" class="tab tab-active">All</button>

            <button onclick="filterOpen()" class="tab">Open</button>

            <button onclick="filterClosed()" class="tab">Closed</button>

        </div>

    </div>


    <!-- Loading -->
     
    <div id="loading" class="text-center mt-10 hidden">

        <span class="loading loading-spinner loading-lg"></span>

    </div>


    <!-- Cards -->

    <div id="issuesContainer" class="max-w-6xl mx-auto mt-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
    </div>



    <!-- Modal -->

    <dialog id="issueModal" class="modal">

        <div class="modal-box">

            <h3 id="modalTitle" class="font-bold text-lg"></h3>

            <p id="modalDesc" class="py-2"></p>

            <p id="modalAuthor"></p>

            <p id="modalPriority"></p>

            <div class="modal-action">

                <button onclick="closeModal()" class="btn">Close</button>

            </div>

        </div>

    </dialog>


    <script src="script.js"></script>

</body>

</html>
